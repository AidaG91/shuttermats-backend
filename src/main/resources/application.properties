spring.application.name=shuttermats-backend

# Server port
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shuttermatsdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:femcoders}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Event image uploads (local disk storage)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Override with environment variables outside of local dev; the hash below
# corresponds to the password "ShutterMats2026!" for development only.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:$2b$10$ORW.Mb2OmWL5/8oiQddyqe7JOpuZb6x50dLgkG9nWMCUJcSd3GroW}

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-shuttermats-secret-key-change-me-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Email (notification for new contact messages)
# Configured for the domain mailbox on Hostalia (contact@shuttermats.com):
# it authenticates like a regular account over SMTP with STARTTLS, no OAuth
# needed (unlike personal Outlook/Microsoft 365 accounts, which since 2022
# require OAuth2 for SMTP AUTH). Per Hostalia's own docs (ayuda.hostalia.com,
# "Configurar el envio de correo desde paginas web / PHP"), the recommended
# generic SMTP server is smtp.servidor-correo.net on port 587 with TLS -
# NOT smtp.<yourdomain>, since their cert won't match a domain-based
# hostname if you connect over SSL/TLS with that name instead.
spring.mail.host=${MAIL_HOST:smtp.servidor-correo.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Sender and recipient for contact notifications.
# app.notifications.admin-email is who gets the alert: it can be the same
# domain mailbox or your personal email, whichever you prefer to check.
app.mail.from=${MAIL_FROM:contact@shuttermats.com}
app.notifications.admin-email=${ADMIN_NOTIFICATION_EMAIL:contact@shuttermats.com}
# If sending fails (SMTP misconfigured, etc.) it must not break the contact
# form submit: it just logs a warning.
app.notifications.enabled=${MAIL_NOTIFICATIONS_ENABLED:true}
