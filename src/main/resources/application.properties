spring.application.name=shuttermats-backend

# Puerto del servidor
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shuttermatsdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:femcoders}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# La tabla debe existir antes de que data.sql inserte el seed
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Subida de imagenes de eventos (almacenamiento en disco local)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Admin (usuario unico, sin tabla en BD - ver KAN-78/79/80).
# Sobreescribe con variables de entorno fuera de local; el hash de abajo
# corresponde a la contrasena "ShutterMats2026!" solo para desarrollo.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:$2b$10$ORW.Mb2OmWL5/8oiQddyqe7JOpuZb6x50dLgkG9nWMCUJcSd3GroW}

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-shuttermats-secret-key-change-me-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
