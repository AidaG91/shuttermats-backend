# Tests use an in-memory H2 instance so they don't depend on Postgres running
spring.datasource.url=jdbc:h2:mem:shuttermatsdb-test;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Admin/JWT (same dev hash as application.properties, password "ShutterMats2026!")
app.admin.username=admin
app.admin.password-hash=$2b$10$ORW.Mb2OmWL5/8oiQddyqe7JOpuZb6x50dLgkG9nWMCUJcSd3GroW
app.jwt.secret=test-only-shuttermats-secret-key-not-for-prod-use-0000000000
app.jwt.expiration-ms=3600000

# Isolated under target/ so it doesn't pollute the real upload directory
app.upload.dir=target/test-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Tests must never send real emails. app.notifications.enabled=false makes
# EmailServiceImpl skip the JavaMailSender entirely, but the JavaMailSender
# bean still needs to be creatable (MailSenderAutoConfiguration requires
# spring.mail.host to be present), otherwise the whole ApplicationContext
# fails to start. The actual values don't matter: it never really connects.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
app.notifications.enabled=false
app.notifications.admin-email=test-admin@example.com
app.mail.from=test-noreply@example.com
